name: Log download counts

on:
  schedule:
    - cron: "35 18 * * *"  # 00:05 in India, every day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Count downloads
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/downloads.py
      - name: Commit
        run: |
          git config user.name "textlore-bot"
          git config user.email "textlore-bot@users.noreply.github.com"
          git add stats/downloads.csv
          git diff --cached --quiet || git commit -m "Download counts $(date -u +%F)"
          git push
