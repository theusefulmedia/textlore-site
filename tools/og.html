<!doctype html>

<html lang="en"><head><meta charset="utf-8"><title>og</title>
<link rel="stylesheet" href="/assets/site.css">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
.og{position:relative;width:1200px;height:630px;overflow:hidden;color:#fff;isolation:isolate;

.brand{display:flex;align-items:center;gap:14px;font:700 30px/1 var(--font);letter-spacing:-.01em}
.brand img{width:64px;height:64px;border-radius:15px;box-shadow:0 10px 30px rgba(10,6,40,.4)}
h1{margin-top:42px;font:800 58px/1.05 var(--font);letter-spacing:-.025em}

p{margin-top:26px;font:500 23px/1.4 var(--font);color:rgba(255,255,255,.85)}
.shot{position:absolute;left:660px;top:120px;width:760px;border-radius:16px;overflow:hidden;transform:perspective(1800px) rotateY(-14deg) rotateX(4deg) rotateZ(-2deg);box-shadow:0 40px 100px rgba(5,2,30,.7)}
.shot img{width:100%;display:block}
